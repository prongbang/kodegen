name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  # The dialect-specific code `kodegen add` writes lives in string constants, so
  # `cargo test` never compiles a line of it — it only compares strings. This is
  # the only job that puts a rustc in front of the output, which makes it the
  # only thing standing between a typo in a template constant and every user who
  # runs `kodegen add`. One job per capability that generates distinct code —
  # mariadb is skipped because it is byte-for-byte identical to mysql (same
  # feature, same connection type, same migration; only the image differs).
  #
  # `mongodb` is the only one where compiling is more than a typo check: it is
  # what puts a rustc in front of a project whose Diesel modules are gated out
  # of `infrastructure/mod.rs` and whose `bootstrap.rs` no longer names them.
  # Nothing else — here or in the template's own CI — ever compiles that state.
  #
  # `s3` is the slow one: the AWS SDK brings rustls and aws-lc-sys, which builds
  # C from source. It stays a full fmt/clippy/check/test job anyway — this is the
  # only place that compiles the adapter at all, and a cheaper job would prove
  # less than nothing.
  #
  # `timescaledb` is here even though its Rust output is postgres's byte for
  # byte: what differs is the migration, and `cargo test` runs it only when
  # DATABASE_URL is set — so this job is a typo check on the SQL constants and
  # nothing more. The migration itself is proven against a real server locally
  # (`CREATE EXTENSION` inside Diesel's transaction, then `create_hypertable`).
  #
  # `clickhouse` and `influxdb` are both listed because they are the two halves
  # of one slot: only one of them can ever be compiled in a single project, so a
  # job per capability is the only way either adapter is compiled at all.
  #
  # `postgres --orm seaorm` earns its row twice over: it is the first time a line
  # of the SeaORM adapter meets a compiler, and the first time this matrix runs a
  # datastore *live* — the schema arrives with the first connection, so unlike
  # the Diesel rows there is nothing to apply first. It also compiles the state
  # where Diesel is gated out of both `bootstrap.rs` and `infrastructure/mod.rs`
  # while a `Db` handle still exists, which nothing else does.
  #
  # `mysql --orm seaorm` is the second ORM's other row, and it is a *runtime*
  # row: the generated Rust is postgres's apart from one `VARCHAR(64)`, so
  # compiling it again would prove almost nothing. What only a real MySQL server
  # can answer is the upsert — `ON DUPLICATE KEY UPDATE` reports 0 affected rows
  # when the new values equal the old, and sea-orm's `exec` turns that into
  # `RecordNotInserted`, which would make `save` fail the contract the port
  # documents. `exec_without_returning` is the fix and this row is the proof;
  # `save_twice_identical_values_is_ok` is the test that fails without it, and
  # the second Test step re-runs the whole suite over rows that already exist.
  # mariadb has no row for the usual reason: same feature, same adapter, same
  # DDL — only the compose image differs, and a unit test pins that.
  #
  # `mssql` is the third row that runs its datastore live, and the only one that
  # has to, because none of its SQL is checked by anything else: no ORM builds a
  # query here, so `MERGE ... WITH (HOLDLOCK)` and `IF OBJECT_ID(...) IS NULL`
  # are strings until a server parses them. `CREATE TABLE IF NOT EXISTS` — which
  # every other backend here uses — is a *runtime* syntax error on SQL Server, so
  # a compile-only row would prove nothing at all. It runs the suite twice like
  # the SeaORM rows, and it is also the only row that builds the Docker image,
  # for the reason in that step.
  #
  # `greptimedb` writes byte-for-byte what `influxdb` does apart from the compose
  # service (a unit test pins that), so compiling it again would prove nothing.
  # It is here for the *server*: the step below boots the image it just generated
  # and runs the contract test against GreptimeDB's line-protocol endpoint, which
  # is the only thing that keeps "one adapter covers both" a fact rather than a
  # claim about a compatibility layer nobody exercised.
  generated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `include:` with no base dimension, so that the SeaORM row is a row of its
      # own: an include entry whose `capability` matches an existing combination
      # would be merged *into* it, and there would be no plain `postgres` job
      # left. Every entry is one job, and `orm` is simply absent from the others.
      matrix:
        include:
          - capability: postgres
          - capability: mysql
          - capability: timescaledb
          - capability: mongodb
          - capability: redis
          - capability: s3
          - capability: clickhouse
          - capability: influxdb
          - capability: greptimedb
          - capability: scalar
          # The SeaORM path, and the only rows in this matrix that run their
          # datastore live. That is not a bonus: it is the only way to prove the
          # startup DDL, because there is no migration step to apply and the
          # schema arrives with the first connection. They boot the compose file
          # `add` just wrote — the same trick the influxdb row uses — and then
          # run the suite *twice* (see the second Test step). `db_url` is carried
          # per row rather than branched on below: it is the same URL `kodegen
          # add` prints for that backend.
          - capability: postgres
            orm: seaorm
            db_url: postgres://app:app@127.0.0.1:5432/app
          - capability: mysql
            orm: seaorm
            db_url: mysql://app:app@127.0.0.1:3306/app
          # No `orm:` — `--orm` on this one is an error, which is the point of
          # the capability. `db_url` is an ADO.NET connection string rather than
          # a URL, and it is what `kodegen add mssql` prints.
          - capability: mssql
            db_url: server=tcp:127.0.0.1,1433;user id=sa;password=kodeGen!2026;database=app;encrypt=true;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # the generated projects are built outside this workspace, so their target
      # dirs are cached only if the action is told where they are
      # demo-with is not listed: nothing compiles it — the `new --with` step
      # below only proves the command produces the same tree in one go
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/demo

      # the generated project's build.rs compiles its .proto files
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # --locked throughout: flipping a cargo feature must never need a lock
      # update, and this is what proves it. Both bundled C drivers build from
      # source (pq-src / mysqlclient-src + vendored openssl); ubuntu-latest
      # already ships the perl, make and cmake they need.
      # deliberately new -> feature -> add, not `new --with`: `kodegen feature`
      # runs `cargo fmt` over the project, and `add` compares the files it
      # replaces against the template verbatim. Only this order catches a
      # template file whose formatting is not already what rustfmt wants.
      - name: Generate, scaffold a feature, then switch backend
        run: |
          cargo run --locked -- new demo --output "$RUNNER_TEMP"
          cargo run --locked -- feature order --path "$RUNNER_TEMP/demo"
          cargo run --locked -- add ${{ matrix.capability }} ${{ matrix.orm && format('--orm {0}', matrix.orm) || '' }} --path "$RUNNER_TEMP/demo"

      # ...and then the other order, into the same project, because the two are
      # not symmetric: a feature scaffolded *after* `add mongodb` has to name the
      # handle that capability left behind, and only this direction compiles it.
      # `notification` rather than a short name on purpose — it is long enough
      # that `cargo fmt` wraps the generated signature, which is the shape the
      # first order has to find and rewrite.
      - name: Scaffold another feature on top of the capability
        run: cargo run --locked -- feature notification --path "$RUNNER_TEMP/demo"

      # The one place sqlx and the AWS SDK are compiled into the same binary.
      # They are the two halves of the rustls provider question (`blob` can only
      # take aws-lc-rs, so `seaorm` is pinned to it too), and no other job can
      # put them together: `generated-all` runs mongodb in the datastore slot,
      # which excludes both ORMs. One extra `add` on a project that already has
      # its datastore — s3 is additive, so nothing is displaced.
      - name: Add the object store on top, so sqlx and the AWS SDK link together
        if: matrix.orm == 'seaorm'
        run: cargo run --locked -- add s3 --path "$RUNNER_TEMP/demo"

      - name: new --with is the same thing in one command
        run: cargo run --locked -- new demo-with --with ${{ matrix.capability }} ${{ matrix.orm && format('--orm {0}', matrix.orm) || '' }} --output "$RUNNER_TEMP"

      - name: Format check
        run: cargo fmt --check
        working-directory: ${{ runner.temp }}/demo

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: ${{ runner.temp }}/demo

      # The generated-all job below runs clickhouse (the event sink whose write
      # can be counted back out), so this step and the greptimedb one after it are
      # the only places the line-protocol adapter meets a server rather than only
      # a compiler — one per product it claims to cover. Booted from the compose
      # file `add influxdb` just wrote, which makes this a check on that file too.
      # `--wait` blocks on its healthcheck; the variables go into the environment
      # only on this branch, so every other capability's Test step still runs with
      # none of them set.
      - name: Boot the time-series server the compose file generated
        if: matrix.capability == 'influxdb'
        working-directory: ${{ runner.temp }}/demo
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait
          {
            echo "INFLUX_URL=http://127.0.0.1:8086"
            echo "INFLUX_BUCKET=app"
            echo "INFLUX_ORG=app"
            echo "INFLUX_TOKEN=kodegen-dev-token"
          } >> "$GITHUB_ENV"

      # The same thing one product over, and the reason this capability has a row
      # at all: `INFLUX_BUCKET` is `public` because GreptimeDB creates a table on
      # write but never a database, and no token because standalone runs with
      # authentication off. Both are what `kodegen add greptimedb` prints.
      - name: Boot the GreptimeDB the compose file generated
        if: matrix.capability == 'greptimedb'
        working-directory: ${{ runner.temp }}/demo
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait
          {
            echo "INFLUX_URL=http://127.0.0.1:4000/v1/influxdb"
            echo "INFLUX_BUCKET=public"
          } >> "$GITHUB_ENV"

      # The SeaORM rows, and the only datastores in this matrix that run live.
      # They can, because nothing has to be applied first: the adapter creates
      # its own schema on the first connection. Booted from the compose file
      # `add <backend> --orm seaorm` just wrote — a check on that file too, and
      # it is the *same* service the Diesel row for the backend generates.
      - name: Boot the database the compose file generated
        if: matrix.orm == 'seaorm'
        working-directory: ${{ runner.temp }}/demo
        env:
          DB_URL: ${{ matrix.db_url }}
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      # The same idea one backend over, in two commands instead of one — and the
      # two commands are not a style choice. `up -d --wait` over the whole file
      # exits **1** here even when everything worked: `mssql-init` is a one-shot
      # service that runs `CREATE DATABASE app` and exits 0, and `--wait` reads a
      # container that is no longer running as a failed dependency. Measured, not
      # assumed. Naming the long-running service and then running the init one is
      # what makes both steps report what actually happened.
      #
      # The init service exists because this image, unlike postgres and mysql,
      # creates no database of its own: it boots with master/tempdb/model/msdb,
      # and `database=app` in the connection string resolves to nothing until
      # somebody runs that statement. The same is true of a real deployment,
      # which is why it is a compose service rather than something the app does.
      - name: Boot SQL Server and create the database
        if: matrix.capability == 'mssql'
        working-directory: ${{ runner.temp }}/demo
        env:
          DB_URL: ${{ matrix.db_url }}
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait mssql
          docker compose -f docker-compose.dev.yml run --rm mssql-init
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      # no `cargo check` step: `clippy --all-targets` above already type-checks
      # everything `check` would, and compiling the AWS SDK twice is minutes.
      #
      # no DATABASE_URL and no REDIS_URL, so the adapter tests skip themselves
      # and the in-memory adapters are what run — the promise that a generated
      # project is green without a server. The influxdb, greptimedb and seaorm
      # rows are the exception, and deliberately so: the steps above set INFLUX_*
      # or DATABASE_URL for them, so there the adapter runs against a real server
      # instead of skipping.
      - name: Test
        run: cargo test --locked
        working-directory: ${{ runner.temp }}/demo

      # The one thing `cargo test` above proves green without proving *which*
      # routes ended up in the spec: `tests/apidocs.rs` (written by `add
      # scalar`) prints every path in `/openapi.json`, and this greps that
      # output for the two features this row scaffolded on opposite sides of
      # `add scalar` — `order` before it (found by `scanned_openapi_paths`),
      # `notification` after it (found by `add_feature`'s marker insert). Both
      # missing would mean one direction silently lost its routes; this is the
      # only place that notices.
      - name: The spec must cover both scaffold orders
        if: matrix.capability == 'scalar'
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -o pipefail
          cargo test --locked --test apidocs -- --nocapture | tee "$RUNNER_TEMP/apidocs-out.txt"
          grep -q '/order' "$RUNNER_TEMP/apidocs-out.txt"
          grep -q '/notification' "$RUNNER_TEMP/apidocs-out.txt"

      # The same suite again, over the database the run above left behind, in a
      # new process. This is the whole gate for the startup DDL: run one proves
      # it creates the schema, run two proves every statement is idempotent —
      # `CREATE TABLE IF NOT EXISTS` and, on TimescaleDB, `create_hypertable(...,
      # if_not_exists => TRUE)`, which is the one that fails on the *second* boot
      # when it is missing. It also re-runs the upsert against rows that already
      # exist, which is where `exec_without_returning` earns its place: a `save`
      # of unchanged values affects 0 rows, and `exec` would call that an error.
      - name: Test again over the same database (the DDL must be idempotent)
        if: matrix.orm == 'seaorm' || matrix.capability == 'mssql'
        run: cargo test --locked
        working-directory: ${{ runner.temp }}/demo

      # The one thing a green test run here cannot tell you, and the reason this
      # step is permanent rather than a one-off check before merge.
      #
      # `mssql` links OpenSSL statically (`openssl-sys` with `vendored`, because
      # native-tls would otherwise want a system libssl the distroless/cc runtime
      # image does not have). A vendored OpenSSL compiles in an `OPENSSLDIR`
      # pointing at its own build directory, which does not exist in the runtime
      # image — so without `ENV SSL_CERT_FILE` it cannot verify **any**
      # certificate, and the first thing to notice would be a production
      # deployment failing to reach Azure SQL. Everything above stays green
      # regardless, because the compose file connects with
      # `TrustServerCertificate=true` and never validates anything. Same class of
      # bug as a missing rustls provider: all tests pass, the product does not
      # work.
      #
      # `docker run --entrypoint` cannot do this check: distroless has no shell
      # and no coreutils, so there is nothing to exec. `docker create` +
      # `docker cp` reads the file out of the image without running it, which is
      # the assertion the image can actually answer.
      #
      # And it reads it out of the **base** image named by the runtime `FROM`
      # rather than out of a built one. Building the project's image here would
      # cost 8-15 minutes to prove two things, and only one of them needs a build:
      # that `ENV SSL_CERT_FILE` is in the Dockerfile (a property of the text, and
      # `docker build` cannot lose a line it was given) and that the base image
      # actually contains that file (a property of the base image, which the build
      # does not change). Pulling the base directly answers the second in about
      # ten seconds. The scratch file goes to RUNNER_TEMP, not here, so it cannot
      # end up in a build context.
      - name: The runtime image must carry a CA store for the static OpenSSL
        if: matrix.capability == 'mssql'
        working-directory: ${{ runner.temp }}/demo
        run: |
          grep -q '^ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt$' Dockerfile
          base=$(awk '/^FROM /{ last = $2 } END { print last }' Dockerfile)
          echo "runtime base image: $base"
          docker pull "$base"
          cid=$(docker create "$base" /nonexistent)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid":/etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/image-ca.crt"
          test -s "$RUNNER_TEMP/image-ca.crt"
          test "$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/image-ca.crt")" -gt 100

  # One job with one occupant of every slot plus every additive capability. Two
  # things only exist here: cargo feature unification across the whole
  # optional-dependency set, and five independent `add`s writing into the same
  # `Services` literal and the same compose file (`scalar` writes into neither —
  # it is the one that proves unification without also writing a resource or a
  # compose service). Neither is visible from a per-capability job.
  #
  # It is also the only job that puts a real server behind an adapter — the
  # matrix above proves a generated project is green *without* one, which is a
  # different promise and would be satisfied by an adapter that never works.
  generated-all:
    runs-on: ubuntu-latest
    services:
      # The datastore here is mongodb, not postgres, because it is the only one
      # whose adapter this job can actually run: Diesel needs its migration
      # applied before a query works and there is no step here that applies one,
      # while `save` upserts on `_id` and needs nothing set up. So the datastore
      # slot is proven at compile time in the matrix above (postgres, mysql) and
      # at runtime here.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # the same image `kodegen add s3` writes into docker-compose.dev.yml, so
      # what CI proves and what a developer boots locally are one thing. Any
      # S3-compatible server would do — that is the point of the adapter. The
      # compose file can swap in `minio/minio`; a service container here cannot,
      # because MinIO needs `command: server /data` and there is no `command:`
      # key for service containers.
      #
      # no `--health-cmd`: it runs *inside* the image, so it would tie this job
      # to whether that image happens to ship curl. Polled from the runner below
      # instead, where the tools are ours.
      s3:
        image: rustfs/rustfs:1.0.0-beta.11
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
      # The event sink here is clickhouse, not influxdb, for the same reason the
      # datastore is mongodb: one of the two has to be picked (they share a slot),
      # and this is the one whose write can be *verified* rather than only
      # acknowledged — `tests/events.rs` counts the rows back out. influxdb is
      # proven at compile time in the matrix above and against a real server
      # locally (a 2xx from /api/v2/write, which the adapter turns into the only
      # `Ok` it can return).
      #
      # The credentials are not optional: since 25.x the image refuses to leave
      # its `default` user without a password.
      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine
        env:
          CLICKHOUSE_DB: app
          CLICKHOUSE_USER: app
          CLICKHOUSE_PASSWORD: app
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/demo-all

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # any answer means it is listening — an unauthenticated request to the
      # root is a 403, which is why this does not use `curl -f`
      - name: Wait for the object store
        run: |
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:9000 && exit 0
            sleep 2
          done
          echo "rustfs did not come up"; exit 1

      - name: Generate with every capability on
        run: cargo run --locked -- new demo-all --with mongodb,redis,s3,clickhouse,scalar --output "$RUNNER_TEMP"

      - name: Format check
        run: cargo fmt --check
        working-directory: ${{ runner.temp }}/demo-all

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: ${{ runner.temp }}/demo-all

      # Every URL set, so every adapter written by an `add` runs against the
      # server above rather than skipping — including `tests/api.rs`, which goes
      # through `bootstrap::build_router()` and therefore through the Mongo
      # repository here. Nothing needs seeding first: the blob test creates its
      # own bucket, and the Mongo tests upsert. Re-running the job against a
      # database a previous run left non-empty is green for the same reason.
      - name: Test against a live datastore, cache, object store and event sink
        run: cargo test --locked
        working-directory: ${{ runner.temp }}/demo-all
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017
          MONGODB_DB: app
          REDIS_URL: redis://127.0.0.1:6379
          S3_BUCKET: app
          S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_DB: app
          CLICKHOUSE_USER: app
          CLICKHOUSE_PASSWORD: app

  # The template's Cargo.lock is a file in *this* repo, so its advisories are
  # this repo's problem: every project generated from it inherits the lock, and
  # nothing else here reads it. The generated project's own CI has an audit job,
  # but that only fires after somebody generates a project and pushes it — this
  # is the copy that fires on every change to the template.
  #
  # `.cargo/audit.toml` next to it is what makes `rsa` (RUSTSEC-2023-0071, no
  # fixed version, pulled in by `seaorm-mysql`) an ignore with a written reason
  # rather than a permanently red job. Anything else that appears here is real:
  # the fix is a lock bump, not another entry in that file.
  audit-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the template's lock
        run: cargo audit
        working-directory: templates/hexagonal
