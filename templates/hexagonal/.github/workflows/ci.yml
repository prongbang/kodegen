name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # The point of the optional backends is that turning one on never
      # invalidates Cargo.lock — unproven unless CI actually resolves them with
      # --locked. Both build their C driver from source (pq-src / mysqlclient-src
      # + vendored openssl); ubuntu-latest images already ship perl and cmake,
      # so no extra apt packages are needed here.
      - name: Check postgres backend
        run: cargo check --locked --features postgres

      - name: Check mysql backend
        run: cargo check --locked --features mysql

      # There is deliberately no `--features seaorm-postgres` row here: `default`
      # is still `["sqlite"]`, so that state is `relational` + `seaorm` together,
      # which src/lib.rs refuses with a `compile_error!` — one ORM per project.
      # It is kodegen's own CI that compiles the SeaORM project, after
      # `kodegen add postgres --orm seaorm` has taken the datastore slot.

      # The one backend that is not Diesel. Additive here like the two above —
      # `default = ["sqlite"]` is still on, so this proves the lock already pins
      # `mongodb` and resolves it, not that the project compiles with Diesel
      # gated out. That state only exists after `kodegen add mongodb` rewrites
      # `bootstrap.rs` too, so it is kodegen's CI that compiles it, not this one.
      - name: Check document backend
        run: cargo check --locked --features document

      # The datastore slot's third occupant, and the one with no ORM. Additive
      # here like the rows above, but it proves the thing that is easiest to get
      # wrong about this feature: that `mssql` resolves with --locked *and* that
      # `openssl-sys` unifies to `vendored` next to a Diesel backend rather than
      # trying to link a system libssl that the runtime image does not have.
      # ubuntu-latest ships the perl and make that vendored OpenSSL needs.
      - name: Check mssql backend
        run: cargo check --locked --features mssql

      # Not a backend — `cache` sits alongside one. Turning it on with no cache
      # adapter generated is still the check that matters: it is what proves the
      # lock already pins `redis` before `kodegen add redis` needs it.
      - name: Check cache feature
        run: cargo check --locked --features cache

      # Same idea, and the one that matters most for the lock: the AWS SDK moves
      # its MSRV faster than anything else here, so `resolver = "3"` picking a
      # version this toolchain can build is a claim only a real resolve proves.
      - name: Check blob feature
        run: cargo check --locked --features blob

      # The two halves of the event-sink slot. `analytics` is the other MSRV
      # check that matters: `clickhouse` is held at 0.13 because 0.14+ needs
      # rustc 1.89 and this package declares 1.88, and only a real resolve says
      # whether that is still true.
      - name: Check analytics feature
        run: cargo check --locked --features analytics

      # `timeseries` adds no package to the lock at all — it names hyper,
      # hyper-util and http-body-util, which tonic already pulls in. This is what
      # notices if that stops being true.
      - name: Check timeseries feature
        run: cargo check --locked --features timeseries

      # Not a backend either, and no slot — `apidocs` is `kodegen add scalar`'s
      # switch. Turning it on with no `openapi.rs` generated yet still proves
      # the lock already pins `utoipa`/`utoipa-scalar` with `--locked`, and that
      # every `cfg_attr(feature = "apidocs", ...)` line `kodegen feature` writes
      # unconditionally actually compiles once the feature is real.
      - name: Check apidocs feature
        run: cargo check --locked --features apidocs

  # Separate job: an advisory landing in RustSec is not a reason to hold up the
  # fmt/clippy/test signal, and vice versa. cargo-audit is run directly rather
  # than via rustsec/audit-check, which needs a write-scoped token to publish a
  # check run — pull requests from forks only get a read-only one.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
