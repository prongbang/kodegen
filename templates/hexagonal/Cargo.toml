[package]
name = "hexagonal-rs"
version = "0.1.0"
edition = "2021"
# The highest MSRV in the locked graph (tonic 0.14 and redis 1.4 both want it).
# Declared rather than left implicit so an older toolchain fails with "requires
# rustc 1.88" instead of an unrelated error deep in a dependency. Keep the
# Dockerfile's build stage at or above this.
rust-version = "1.88"
# MSRV-aware resolution, and not optional once `aws-sdk-s3` is in the graph: the
# whole AWS SDK now requires rustc 1.94, so re-resolving this lock with the
# default resolver would pull a version of it nobody on `rust-version` can
# build. With resolver 3 cargo picks the newest release that still compiles on
# the MSRV above, which is what keeps that line honest across a `cargo update`.
# (It also raises the floor for cargo itself: below 1.84 this key fails to parse
# with "`resolver` setting `3` is not valid", before any MSRV message.)
resolver = "3"

[dependencies]
axum = { version = "0.8.4", features = ["tokio", "http1"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
recloser = "1.4.0"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
diesel = { version = "2.3.11", features = ["r2d2"] }
diesel_migrations = "2.3.2"
# The backend C libraries are declared here (not left to diesel) so that
# `bundled` is on: the runtime image is distroless/cc and has no libpq /
# libmysqlclient to link against dynamically. Versions must stay inside
# diesel's own ranges (pq-sys <0.8, mysqlclient-sys <0.6) or cargo ends up
# with two copies of a `links` crate.
libsqlite3-sys = { version = "0.37", features = ["bundled"], optional = true }
pq-sys = { version = "0.7", features = ["bundled"], optional = true }
mysqlclient-sys = { version = "0.5", features = ["bundled"], optional = true }
# Both bundled backends pull in openssl-sys, which links the *system* libssl by
# default — distroless/cc has none. `vendored` statically links it instead
# (costs perl in the build stage).
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
# Pure Rust, so it costs the runtime image nothing. `connection-manager` is what
# makes one multiplexed connection reconnect on its own; the default features
# (acl/streams/geospatial/script) are commands this template does not use.
redis = { version = "1.4.1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
], optional = true }
# S3-compatible object storage: one SDK covers RustFS, MinIO, Ceph and AWS S3
# itself, because they all speak the same API. Pure Rust over rustls, so the
# distroless/cc runtime image needs nothing extra — but the SDK's own MSRV moves
# fast (1.94 as of today), which is what `resolver = "3"` above is holding back.
# The default features are trimmed to what an S3 client needs. `sigv4a` is for
# multi-region access points and drags in an elliptic-curve stack; `rustls` is
# the SDK's *legacy* hyper-0.14 TLS path, and `default-https-client` already
# brings a current rustls — enabling both locks two full TLS stacks.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "default-https-client",
], optional = true }

# Which backend C driver gets compiled and linked. Optional dependencies are all
# pinned in Cargo.lock whether or not their feature is on, so flipping `default`
# never invalidates `cargo build --locked`.
#
# Flipping a feature on its own changes nothing about how the app behaves:
# `infrastructure/diesel_db.rs` is written against `SqliteConnection`. Switching
# the connection type (and the migrations that go with it) is `kodegen add
# <db>`'s job — it rewrites that file and flips `default` together.
[features]
default = ["sqlite"]
sqlite = ["diesel/sqlite", "dep:libsqlite3-sys"]
postgres = ["diesel/postgres", "dep:pq-sys", "dep:openssl-sys"]
mysql = ["diesel/mysql", "dep:mysqlclient-sys", "dep:openssl-sys"]
# Not a backend: `cache` sits alongside whichever relational feature is on.
# Redis and Valkey speak the same protocol, so this one feature covers both.
cache = ["dep:redis"]
# Also not a backend. `tokio/fs` is for the *default* adapter, which stores blobs
# in a directory — the S3 SDK is only half of what `blob` turns on.
blob = ["dep:aws-sdk-s3", "tokio/fs"]

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
tonic-prost-build = "0.14.6"
