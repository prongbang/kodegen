[package]
name = "hexagonal-rs"
version = "0.1.0"
edition = "2021"
# The highest MSRV in the locked graph (tonic 0.14 and redis 1.4 both want it).
# Declared rather than left implicit so an older toolchain fails with "requires
# rustc 1.88" instead of an unrelated error deep in a dependency. Keep the
# Dockerfile's build stage at or above this.
rust-version = "1.88"
# MSRV-aware resolution, and not optional once `aws-sdk-s3` is in the graph: the
# whole AWS SDK now requires rustc 1.94, so re-resolving this lock with the
# default resolver would pull a version of it nobody on `rust-version` can
# build. With resolver 3 cargo picks the newest release that still compiles on
# the MSRV above, which is what keeps that line honest across a `cargo update`.
# (It also raises the floor for cargo itself: below 1.84 this key fails to parse
# with "`resolver` setting `3` is not valid", before any MSRV message.)
resolver = "3"

[dependencies]
axum = { version = "0.8.4", features = ["tokio", "http1"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    # Unconditional rather than only via the capability features below that also
    # ask for it: `main.rs` fans one shutdown signal out to both servers over a
    # `watch` channel, so the base template needs it too. It is a leaf module of
    # a crate already in the graph — enabling it always costs nothing.
    "sync",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
# `json` is what `LOG_FORMAT=json` selects (see `main.rs`): the same layer, one
# object per line, so a container's stdout is machine-readable without a parser
# in the log shipper. It only adds serde_json (already here) + tracing-serde.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
recloser = "1.4.0"
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
# The standard `grpc.health.v1` service, so a Kubernetes gRPC probe (or grpcurl)
# gets the same answer `GET /ready` gives — see `bootstrap::grpc_routes`. Same
# 0.14 line as tonic; its dependencies were all in the lock already.
tonic-health = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
# The three HTTP middlewares a deployed service needs and axum ships none of: an
# `x-request-id` on every response, one span + one line per request, and a wall
# clock on the handler (see `api::middleware`). The `Layer` trait it hangs those
# off is `tower`, already here; nothing else enters the lock but `uuid`.
tower-http = { version = "0.6.11", features = ["request-id", "timeout", "trace"] }
# Prometheus metrics, for the same reason as the line above: axum ships none.
# `metrics` is the facade the ~20-line middleware in `api/mod.rs` records
# through and this is the recorder `/metrics` renders. `axum-prometheus` was the
# alternative and is strictly larger both ways — it depends on these two plus a
# builder of its own, for the same three metric families. `default-features =
# false` drops the exporter's own HTTP listener and push gateway (a second
# server on a second port); the handler renders through
# `PrometheusHandle::render()` on the port already open.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# Optional like every other datastore driver, and for the same reason: with
# `document` selected there is no Diesel code left to compile (see
# `infrastructure/mod.rs`), so nothing should pull the ORM or its migration
# harness into the build. `relational` is what turns them on, and every SQL
# backend turns that on.
diesel = { version = "2.3.11", features = ["r2d2"], optional = true }
diesel_migrations = { version = "2.3.2", optional = true }
# The backend C libraries are declared here (not left to diesel) so that
# `bundled` is on: the runtime image is distroless/cc and has no libpq /
# libmysqlclient to link against dynamically. Versions must stay inside
# diesel's own ranges (pq-sys <0.8, mysqlclient-sys <0.6) or cargo ends up
# with two copies of a `links` crate.
libsqlite3-sys = { version = "0.37", features = ["bundled"], optional = true }
pq-sys = { version = "0.7", features = ["bundled"], optional = true }
mysqlclient-sys = { version = "0.5", features = ["bundled"], optional = true }
# Both bundled backends pull in openssl-sys, which links the *system* libssl by
# default — distroless/cc has none. `vendored` statically links it instead
# (costs perl in the build stage).
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
# Pure Rust, so it costs the runtime image nothing. `connection-manager` is what
# makes one multiplexed connection reconnect on its own; the default features
# (acl/streams/geospatial/script) are commands this template does not use.
redis = { version = "1.4.1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
], optional = true }
# S3-compatible object storage: one SDK covers RustFS, MinIO, Ceph and AWS S3
# itself, because they all speak the same API. Pure Rust over rustls, so the
# distroless/cc runtime image needs nothing extra — but the SDK's own MSRV moves
# fast (1.94 as of today), which is what `resolver = "3"` above is holding back.
# The default features are trimmed to what an S3 client needs. `sigv4a` is for
# multi-region access points and drags in an elliptic-curve stack; `rustls` is
# the SDK's *legacy* hyper-0.14 TLS path, and `default-https-client` already
# brings a current rustls — enabling both locks two full TLS stacks.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "default-https-client",
], optional = true }
# Pure Rust as well, so it costs the runtime image nothing. The default features
# pull in bson 2 alongside bson 3 for source compatibility with older 3.x
# releases (`compat-3-0-0`); `bson-3` + `compat-3-3-0` is the same driver on the
# current bson and one whole dependency tree fewer. `dns-resolver` is what makes
# a `mongodb+srv://` URI (Atlas, and every managed deployment) resolvable, and
# `rustls-tls-aws-lc` is what lets it connect once it has.
#
# `rustls-tls-aws-lc` rather than plain `rustls-tls` (which selects ring): the
# driver takes either, and `aws-sdk-s3` takes only aws-lc-rs, so this is the side
# that can move. One provider across the whole graph is what keeps
# `CryptoProvider::from_crate_features()` answering `Some` — see the `sqlx` note
# below for why that matters — and it keeps ring out of the build entirely for a
# project with `document` on and `blob` off.
mongodb = { version = "3.8.0", default-features = false, features = [
    "bson-3",
    "compat-3-3-0",
    "rustls-tls-aws-lc",
    "dns-resolver",
], optional = true }
# The datastore slot's second ORM, and its pure-Rust one: sqlx + rustls all the
# way down, so the build stage needs no perl/make/cmake and the distroless/cc
# runtime image needs nothing extra. Held at `"1"` **by MSRV**: sea-orm 2.0
# declares `rust-version = 1.94` and this package declares 1.88, and semver "1"
# is what keeps 2.0 out until that moves (the same wait `aws-sdk-s3` is in).
# `default-features = false` because the defaults pull chrono, bigdecimal and
# rust_decimal in for column types the `users` table (TEXT only) never uses.
# `runtime-tokio` rather than `runtime-tokio-rustls`: the TLS provider is chosen
# on sqlx below, for the reason written there.
sea-orm = { version = "1", default-features = false, features = [
    "macros",
    "runtime-tokio",
], optional = true }
# Named directly even though sea-orm already brings it, for exactly one reason:
# to pick rustls' crypto provider. sea-orm's own `runtime-tokio-rustls` selects
# `tls-rustls-ring`, while `aws-sdk-s3` (the `blob` feature) and the Mongo driver
# above select aws-lc-rs. Two providers in one graph do not break *these*
# clients — every one of them installs its own explicitly — but they do make
# `rustls::crypto::CryptoProvider::from_crate_features()` return `None`, so the
# process has no default: any rustls code **you** write with a bare
# `ClientConfig::builder()` panics, and the binary links both stacks for nothing.
# One provider everywhere is the fix, and aws-lc-rs is the one `blob` cannot be
# talked out of. sqlx's own default features (any/macros/migrate/json) are a
# compile-time query checker, a second migration framework and runtime backend
# dispatch — none of which this template uses.
sqlx = { version = "0.8", default-features = false, optional = true }
# SQL Server, and the one capability with no ORM behind it: neither Diesel nor
# SeaORM speaks TDS in open source, so `mssql` is raw SQL over tiberius — the
# only maintained TDS implementation Rust has.
#
# `default-features = false` drops `winauth` (Windows-only SSPI, meaningless on
# a Linux runtime image) and keeps the two that matter: `tds73` is the protocol
# version SQL Server 2008+ speaks, and `native-tls` is the TLS backend. Not
# `rustls`: tiberius pins `tokio-rustls 0.24` -> rustls 0.21, a major behind the
# rest of this graph, with no provider system (so `ring` comes back) and three
# unfixable advisories in `rustls-webpki 0.101` that sit squarely in certificate
# validation. See the README.
tiberius = { version = "0.12.3", default-features = false, features = [
    "tds73",
    "native-tls",
], optional = true }
# tiberius has no pool of its own — `Client` is one connection and every query
# takes `&mut self` — so the pool is a crate. bb8 is the async one this driver
# has an adapter for; `with-tokio` is that adapter, and the default features
# (chrono, sql-browser, winauth) are column types and a discovery protocol this
# template does not use.
bb8 = { version = "0.9", optional = true }
bb8-tiberius = { version = "0.16", default-features = false, features = [
    "with-tokio",
], optional = true }
# The official ClickHouse client, held at 0.13 **by MSRV**: 0.14 and 0.15 declare
# `rust-version = 1.89`, and this package declares 1.88. With `resolver = "3"`
# cargo would still pick 0.15 (it warns and falls back when no compatible version
# exists in the range), so the range itself is what keeps that line honest.
# Raising `rust-version` to 1.89 is all it takes to move to 0.15.
clickhouse = { version = "0.13", optional = true }
# The line-protocol sink posts text over HTTP, and the graph already contains a
# full HTTP client: tonic's channel brings hyper + hyper-util + http-body-util in
# unconditionally, so naming them here as direct dependencies adds **nothing** to
# Cargo.lock. That is the whole reason this capability is not `reqwest` (+12
# packages, including a QUIC stack) — the adapter is one POST.
hyper = { version = "1", default-features = false, features = [
    "client",
    "http1",
], optional = true }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "tokio",
], optional = true }
http-body-util = { version = "0.1", optional = true }
# End-to-end encryption for axum: XChaCha20-Poly1305 per-client keys agreed via
# X25519 on a handshake endpoint, then applied per-request as axum middleware.
# Pure Rust (no C build deps), so the distroless/cc runtime image needs nothing
# extra. `E2EE_SHARED_KEY` is the optional pre-shared fallback key (64 hex chars);
# leaving it unset means clients *must* complete the handshake first.
lazynton = { version = "0.3", optional = true }
# OpenAPI, and the one capability with no server behind it: the spec is derived
# from the handlers themselves (`#[utoipa::path]`), not hand-maintained JSON, so
# it cannot drift the way a static file would the moment a feature adds a route.
# Default features only (`macros`) — the schema collector is recursive over
# `paths(...)`, so `components(schemas(...))` needs no template of its own.
utoipa = { version = "5.5.0", optional = true }
# `axum` is what brings `Scalar::with_url` and the `Servable` trait `add scalar`
# calls into a `Router`; the two other frameworks it supports are not this
# template's problem.
utoipa-scalar = { version = "0.3.0", features = ["axum"], optional = true }

# Which backend C driver gets compiled and linked. Optional dependencies are all
# pinned in Cargo.lock whether or not their feature is on, so flipping `default`
# never invalidates `cargo build --locked`.
#
# Flipping a feature on its own changes nothing about how the app behaves:
# `infrastructure/diesel_db.rs` is written against `SqliteConnection`. Switching
# the connection type (and the migrations that go with it) is `kodegen add
# <db>`'s job — it rewrites that file and flips `default` together.
[features]
default = ["sqlite"]
# Every relational backend turns this on, and nothing else does: it is what
# `infrastructure/mod.rs` gates the Diesel plumbing on. `kodegen add mongodb`
# takes the same datastore slot with a driver that is not Diesel at all, and
# `diesel_db.rs` would not compile with no backend selected.
relational = ["dep:diesel", "dep:diesel_migrations"]
sqlite = ["diesel/sqlite", "dep:libsqlite3-sys", "relational"]
postgres = ["diesel/postgres", "dep:pq-sys", "dep:openssl-sys", "relational"]
mysql = ["diesel/mysql", "dep:mysqlclient-sys", "dep:openssl-sys", "relational"]
# A datastore too, and it occupies the same slot as the three above rather than
# sitting alongside them: MongoDB is a second adapter of the same
# `UserRepository`, not a second database. `tokio/sync` is for the `OnceCell` the
# adapter dials its client through — the driver's constructors are all async and
# the composition root is a plain `fn`.
document = ["dep:mongodb", "tokio/sync"]
# The second ORM over the same relational databases, and a datastore all the
# same: `seaorm` mirrors `relational` exactly — it is what
# `infrastructure/mod.rs` gates the SeaORM modules on, and what the backend
# below builds on. The runtime and the TLS provider are named *here* rather than
# per backend because leaving them out is not a build error: sqlx panics at
# runtime with "either the runtime-async-std or runtime-tokio feature must be
# enabled". `tokio/sync` is for the `OnceCell` the handle dials through, exactly
# like `document`. The two ORMs cannot be on together — `src/lib.rs` says so with
# a `compile_error!`, because cargo features are additive and would otherwise
# happily build both.
#
# `seaorm-mysql` costs one advisory to declare: `sea-orm/sqlx-mysql` pulls `rsa`
# into Cargo.lock, and `rsa` carries RUSTSEC-2023-0071 with no fixed version.
# cargo-audit reads the lock and does not care which features are on, so it fires
# in every generated project. It is ignored in `.cargo/audit.toml`, with the
# reasoning written out there — the short version is that the advisory is about
# RSA *decryption* timing and sqlx-mysql only ever encrypts, with the server's
# public key. The Diesel `mysql` feature above never had this (libmysqlclient
# does its auth in C).
seaorm = ["dep:sea-orm", "sqlx/tls-rustls-aws-lc-rs", "tokio/sync"]
seaorm-postgres = ["seaorm", "sea-orm/sqlx-postgres"]
seaorm-mysql = ["seaorm", "sea-orm/sqlx-mysql"]
# Not a backend: `cache` sits alongside whichever relational feature is on.
# Redis and Valkey speak the same protocol, so this one feature covers both.
cache = ["dep:redis"]
# Also not a backend. `tokio/fs` is for the *default* adapter, which stores blobs
# in a directory — the S3 SDK is only half of what `blob` turns on.
blob = ["dep:aws-sdk-s3", "tokio/fs"]
# The event sink, which is one port with two backends — so these two occupy one
# slot the way `sqlite`/`postgres`/`mysql` occupy the datastore's, and at most one
# is ever on. Named for the shape rather than the vendor for the usual reason:
# `timeseries` is InfluxDB v2, InfluxDB v3 *and* GreptimeDB, which all accept the
# same line protocol over the same kind of endpoint.
# `tokio/sync` is for the `OnceCell` the ClickHouse adapter creates its table
# through — the composition root is a plain `fn`, so the DDL cannot run there.
# The datastore slot's third occupant, and the only one with no ORM: `dep:openssl-sys`
# is not optional here — `native-tls` links the system libssl by default and the
# distroless/cc runtime image has none, so `vendored` (declared above for the
# Diesel backends) is what static-links it, at the cost of perl/make in the build
# stage. `tokio/sync` is for the `OnceCell` the handle builds its pool through,
# exactly like `document` and `seaorm`.
mssql = ["dep:tiberius", "dep:bb8", "dep:bb8-tiberius", "dep:openssl-sys", "tokio/sync"]
analytics = ["dep:clickhouse", "tokio/sync"]
timeseries = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# Not a backend either, and no slot: `GET /docs` (Scalar) + `GET /openapi.json`,
# generated from whichever handlers `kodegen feature`/`kodegen add scalar`
# annotated with `#[cfg_attr(feature = "apidocs", utoipa::path(...))]`. With this
# off, every one of those attributes disappears and neither crate below is even
# compiled — that is the production kill switch (see the README).
apidocs = ["dep:utoipa", "dep:utoipa-scalar"]
# E2EE: one axum middleware + one handshake endpoint. No slot — sits alongside any
# datastore, cache, or blob store. `E2EE_SHARED_KEY` (64 hex chars) is the
# optional pre-shared fallback; without it clients must complete the X25519
# handshake before sending an encrypted request.
e2ee = ["dep:lazynton"]

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
tonic-prost-build = "0.14.6"
